<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <filter id="herbShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14181f" flood-opacity="0.25" />
    </filter>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8261e" />
      <stop offset="100%" stop-color="#7a140e" />
    </linearGradient>
    <linearGradient id="terraceGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a7a4c" />
      <stop offset="100%" stop-color="#184a2c" />
    </linearGradient>
    <linearGradient id="silverHorse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0ece6" />
      <stop offset="100%" stop-color="#c5c0b8" />
    </linearGradient>
  </defs>

  <g filter="url(#herbShadow)">
    <!-- Spanish / French Heraldic Shield Outline -->
    <path d="M 60,110 L 440,110 L 440,380 C 440,510 320,580 250,610 C 180,580 60,510 60,380 Z" fill="url(#shieldRed)" stroke="#2c3038" stroke-width="6" />

    <!-- Green Mount / Terrace at Base -->
    <path d="M 60,420 C 140,400 360,400 440,420 L 440,380 C 440,510 320,580 250,610 C 180,580 60,510 60,380 Z" fill="url(#terraceGreen)" stroke="#1a3b25" stroke-width="3" />

    <!-- Stylized Galloping Silver Horse (Кінь, що скаче) -->
    <g fill="url(#silverHorse)" stroke="#2c3038" stroke-width="3.5" stroke-linejoin="round">
      <!-- Torso & Flank -->
      <path d="M 195,335 C 225,320 280,318 315,340 C 330,350 335,375 320,395 C 295,410 240,405 205,395 C 180,388 175,355 195,335 Z" />
      <!-- Chest & Neck -->
      <path d="M 195,335 C 180,310 170,265 195,225 C 205,210 215,205 228,215 C 235,222 232,245 220,265 C 215,275 220,315 235,330 Z" />
      <!-- Head & Muzzle -->
      <path d="M 195,225 C 185,215 165,210 152,220 C 142,228 145,238 158,242 C 172,246 188,245 198,238 Z" />
      <!-- Ears -->
      <polygon points="198,225 202,205 208,220" />
      <polygon points="208,222 215,202 219,222" />
      <!-- Mane (Розвіяна грива) -->
      <path d="M 215,212 C 235,215 248,235 240,250 C 255,255 260,275 250,290 C 262,298 258,320 242,328" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <!-- Forelegs (Передні підняті ноги в стрибку) -->
      <path d="M 195,385 C 180,410 160,425 140,430 C 132,432 130,422 138,418 C 152,410 168,395 180,375 Z" />
      <path d="M 210,385 C 195,420 185,445 168,460 C 160,465 156,455 164,448 C 176,435 186,410 198,380 Z" />
      <!-- Hindlegs (Задні ноги, що відштовхуються) -->
      <path d="M 315,370 C 340,395 365,430 380,465 C 385,475 372,478 368,468 C 356,440 335,410 310,395 Z" />
      <path d="M 295,385 C 315,415 330,455 342,485 C 347,495 335,498 330,488 C 320,460 305,425 285,400 Z" />
      <!-- Tail (Пишний хвіст за вітром) -->
      <path d="M 325,348 C 360,345 400,358 418,375 C 412,385 385,388 355,380 C 340,375 328,368 325,348 Z" />
    </g>

    <!-- Mural Crown on Top of Shield (Міська мурована корона) -->
    <g fill="#d8d4cc" stroke="#2c3038" stroke-width="3.5">
      <path d="M 160,70 L 340,70 L 340,110 L 160,110 Z" />
      <polygon points="175,70 175,45 195,45 195,70" />
      <polygon points="215,70 215,45 235,45 235,70" />
      <polygon points="265,70 265,45 285,45 285,70" />
      <polygon points="305,70 305,45 325,45 325,70" />
      <!-- Masonry slits -->
      <line x1="200" y1="88" x2="200" y2="102" stroke="#2c3038" stroke-width="3" />
      <line x1="250" y1="88" x2="250" y2="102" stroke="#2c3038" stroke-width="3" />
      <line x1="300" y1="88" x2="300" y2="102" stroke="#2c3038" stroke-width="3" />
    </g>
  </g>
</svg>
